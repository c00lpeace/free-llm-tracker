<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Free LLM Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f6f8fa;
    color: #1f2328;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
      "Apple SD Gothic Neo", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  .page-header {
    background: #fff;
    border-bottom: 1px solid #d1d9e0;
  }
  .page-header-inner {
    max-width: 880px;
    margin: 0 auto;
    padding: 20px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 16px;
  }
  .page-header h1 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .page-header .sub {
    margin: 0;
    font-size: 0.85rem;
    color: #59636e;
  }
  .page-header .meta {
    margin: 0 0 0 auto;
    font-size: 0.8rem;
    color: #59636e;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .page-header a { color: #0969da; text-decoration: none; }
  .page-header a:hover { text-decoration: underline; }
  .wrap {
    max-width: 880px;
    margin: 28px auto 64px;
    padding: 0 16px;
  }
  article {
    background: #fff;
    border: 1px solid #d1d9e0;
    border-radius: 12px;
    padding: 40px 44px;
  }
  @media (max-width: 640px) {
    article { padding: 24px 20px; }
    .page-header .meta { margin-left: 0; }
  }
  article h1 {
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    border-bottom: 1px solid #d1d9e0;
    padding-bottom: 0.4em;
    margin: 0 0 0.8em;
  }
  article h2 {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    border-bottom: 1px solid #d1d9e0;
    padding-bottom: 0.35em;
    margin: 2em 0 0.8em;
  }
  article p { margin: 0.8em 0; }
  article .notice {
    font-size: 0.85rem;
    color: #59636e;
  }
  article ul {
    margin: 0.6em 0;
    padding-left: 1.4em;
  }
  article li { margin: 0.3em 0; }
  article li::marker { color: #59636e; }
  article a { color: #0969da; text-decoration: none; overflow-wrap: anywhere; }
  article a:hover { text-decoration: underline; }
  article code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "D2Coding", monospace;
    font-size: 0.85em;
    background: rgba(175, 184, 193, 0.2);
    padding: 0.2em 0.4em;
    border-radius: 6px;
  }
  article strong { font-weight: 700; }
  article hr {
    border: 0;
    border-top: 1px solid #d1d9e0;
    margin: 2em 0;
  }
  /* 더보기(펼치기) 영역 */
  article details {
    border: 1px solid #d1d9e0;
    border-radius: 8px;
    background: #f6f8fa;
    padding: 10px 16px;
    margin: 10px 0;
  }
  article summary {
    cursor: pointer;
    font-weight: 600;
    outline: none;
  }
  article summary:hover { color: #0969da; }
  article details ul { margin-bottom: 0.4em; }
  /* 우선순위 뱃지 */
  article .prio {
    display: inline-block;
    font-size: 0.62em;
    font-weight: 700;
    line-height: 1.5;
    padding: 0.15em 0.7em;
    border-radius: 999px;
    color: #fff;
    vertical-align: 0.2em;
    margin-left: 0.5em;
    letter-spacing: 0;
  }
  article .p-high { background: #1a7f37; }
  article .p-mid { background: #9a6700; }
  article .p-low { background: #59636e; }
  article .p-no { background: #cf222e; }
  .loading, .error { color: #59636e; padding: 24px 0; }
  .error a { color: #0969da; }
</style>
</head>
<body>
  <header class="page-header">
    <div class="page-header-inner">
      <h1>Free LLM Tracker</h1>
      <p class="sub">Hermes Agent용 무료 LLM API 제공자 추적 기준선</p>
      <p class="meta">
        <span id="updated"></span>
        <a href="https://github.com/c00lpeace/free-llm-tracker">GitHub 저장소</a>
      </p>
    </div>
  </header>
  <div class="wrap">
    <article id="content">
      <p class="loading">기준선을 불러오는 중…</p>
    </article>
  </div>
  <script src="marked.min.js"></script>
  <script>
    var RAW_URL = "https://raw.githubusercontent.com/c00lpeace/free-llm-tracker/main/state.md";

    fetch(RAW_URL, { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (md) {
        var el = document.getElementById("content");
        el.innerHTML = marked.parse(md);
        var links = el.querySelectorAll("a[href]");
        for (var i = 0; i < links.length; i++) {
          var href = links[i].getAttribute("href") || "";
          if (href.charAt(0) === "#") continue; // 페이지 내 목차 앵커는 현재 탭에서 이동
          links[i].target = "_blank";
          links[i].rel = "noopener";
        }
      })
      .catch(function () {
        document.getElementById("content").innerHTML =
          '<p class="error">기준선을 불러오지 못했습니다. ' +
          '<a href="https://github.com/c00lpeace/free-llm-tracker/blob/main/state.md" target="_blank" rel="noopener">' +
          'GitHub에서 직접 확인</a>해 주세요.</p>';
      });

    // 마지막 갱신일 표시 (실패해도 조용히 넘어감)
    fetch("https://api.github.com/repos/c00lpeace/free-llm-tracker/commits?path=state.md&per_page=1")
      .then(function (r) { return r.json(); })
      .then(function (c) {
        if (c && c[0] && c[0].commit) {
          var d = new Date(c[0].commit.committer.date);
          var s = d.getFullYear() + "-" +
            String(d.getMonth() + 1).padStart(2, "0") + "-" +
            String(d.getDate()).padStart(2, "0") + " " +
            String(d.getHours()).padStart(2, "0") + ":" +
            String(d.getMinutes()).padStart(2, "0");
          document.getElementById("updated").textContent = "마지막 갱신 " + s + " · 매일 06:00/18:00";
        }
      })
      .catch(function () {});
  </script>
</body>
</html>
