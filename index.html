<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Free LLM Tracker</title>
<link rel="stylesheet" href="github-markdown.css">
<style>
  body {
    margin: 0;
    background: #f6f8fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
      Helvetica, Arial, sans-serif;
  }
  .page-header {
    background: #24292f;
    color: #fff;
    padding: 28px 16px 20px;
    text-align: center;
  }
  .page-header h1 { margin: 0 0 6px; font-size: 1.6rem; }
  .page-header p { margin: 4px 0; color: #c9d1d9; font-size: 0.9rem; }
  .page-header a { color: #79c0ff; }
  .wrap {
    max-width: 860px;
    margin: 24px auto 48px;
    padding: 0 16px;
  }
  .markdown-body {
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    padding: 32px;
  }
  @media (max-width: 600px) {
    .markdown-body { padding: 20px 16px; }
  }
  /* 더보기(펼치기) 영역 */
  .markdown-body details {
    border: 1px solid #d0d7de;
    border-radius: 6px;
    background: #f6f8fa;
    padding: 10px 14px;
    margin: 10px 0;
  }
  .markdown-body summary {
    cursor: pointer;
    font-weight: 600;
  }
  .markdown-body summary:hover { color: #0969da; }
  .loading, .error { color: #57606a; padding: 24px 0; }
  .error a { color: #0969da; }
</style>
</head>
<body>
  <header class="page-header">
    <h1>Free LLM Tracker</h1>
    <p>Hermes Agent용 무료 LLM API 제공자 추적 기준선 · 매일 06:00 / 18:00 자동 갱신</p>
    <p id="updated"></p>
    <p><a href="https://github.com/c00lpeace/free-llm-tracker">GitHub 저장소에서 보기</a></p>
  </header>
  <div class="wrap">
    <article id="content" class="markdown-body">
      <p class="loading">기준선을 불러오는 중…</p>
    </article>
  </div>
  <script src="marked.min.js"></script>
  <script>
    var RAW_URL = "https://raw.githubusercontent.com/c00lpeace/free-llm-tracker/main/state.md";

    fetch(RAW_URL, { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (md) {
        document.getElementById("content").innerHTML = marked.parse(md);
      })
      .catch(function () {
        document.getElementById("content").innerHTML =
          '<p class="error">기준선을 불러오지 못했습니다. ' +
          '<a href="https://github.com/c00lpeace/free-llm-tracker/blob/main/state.md">' +
          'GitHub에서 직접 확인</a>해 주세요.</p>';
      });

    // 마지막 갱신일 표시 (실패해도 조용히 넘어감)
    fetch("https://api.github.com/repos/c00lpeace/free-llm-tracker/commits?path=state.md&per_page=1")
      .then(function (r) { return r.json(); })
      .then(function (c) {
        if (c && c[0] && c[0].commit) {
          var d = new Date(c[0].commit.committer.date);
          var s = d.getFullYear() + "-" +
            String(d.getMonth() + 1).padStart(2, "0") + "-" +
            String(d.getDate()).padStart(2, "0");
          document.getElementById("updated").textContent = "마지막 갱신: " + s;
        }
      })
      .catch(function () {});
  </script>
</body>
</html>
