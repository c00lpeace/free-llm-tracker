<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Free LLM Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f6f8fa;
    color: #1f2328;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
      "Apple SD Gothic Neo", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  .page-header {
    background: #fff;
    border-bottom: 1px solid #d1d9e0;
  }
  .page-header-inner {
    max-width: 880px;
    margin: 0 auto;
    padding: 20px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 16px;
  }
  .page-header h1 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .page-header .sub {
    margin: 0;
    font-size: 0.85rem;
    color: #59636e;
  }
  .page-header .meta {
    margin: 0 0 0 auto;
    font-size: 0.8rem;
    color: #59636e;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .page-header a { color: #0969da; text-decoration: none; }
  .page-header a:hover { text-decoration: underline; }
  .wrap {
    max-width: 880px;
    margin: 28px auto 64px;
    padding: 0 16px;
  }
  article {
    background: #fff;
    border: 1px solid #d1d9e0;
    border-radius: 12px;
    padding: 40px 44px;
  }
  @media (max-width: 640px) {
    article { padding: 24px 20px; }
    .page-header .meta { margin-left: 0; }
  }
  article h1 {
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    border-bottom: 1px solid #d1d9e0;
    padding-bottom: 0.4em;
    margin: 0 0 0.8em;
  }
  article h2 {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    border-bottom: 1px solid #d1d9e0;
    padding-bottom: 0.35em;
    margin: 2em 0 0.8em;
  }
  article p { margin: 0.8em 0; }
  article .notice {
    font-size: 0.85rem;
    color: #59636e;
  }
  article ul {
    margin: 0.6em 0;
    padding-left: 1.4em;
  }
  article li { margin: 0.3em 0; }
  article li::marker { color: #59636e; }
  article a { color: #0969da; text-decoration: none; overflow-wrap: anywhere; }
  article a:hover { text-decoration: underline; }
  article code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "D2Coding", monospace;
    font-size: 0.85em;
    background: rgba(175, 184, 193, 0.2);
    padding: 0.2em 0.4em;
    border-radius: 6px;
  }
  article strong { font-weight: 700; }
  article hr {
    border: 0;
    border-top: 1px solid #d1d9e0;
    margin: 2em 0;
  }
  article table {
    border-collapse: collapse;
    width: 100%;
    margin: 1em 0;
    font-size: 0.9rem;
  }
  article th, article td {
    border: 1px solid #d1d9e0;
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  article th { background: #f6f8fa; font-weight: 700; }
  article tr:nth-child(even) td { background: #fafbfc; }
  /* 상시/기간한정 탭 */
  .flt-tabs {
    display: flex;
    gap: 8px;
    margin: 28px 0 0;
    border-bottom: 2px solid #d1d9e0;
  }
  .flt-tab {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 10px 22px;
    border: 1px solid transparent;
    border-bottom: 0;
    border-radius: 8px 8px 0 0;
    background: transparent;
    color: #59636e;
    cursor: pointer;
    margin-bottom: -2px;
  }
  .flt-tab:hover { color: #1f2328; background: #f6f8fa; }
  .flt-tab.active {
    color: #0969da;
    background: #fff;
    border-color: #d1d9e0;
  }
  .flt-tab:focus-visible { outline: 2px solid #0969da; outline-offset: 2px; }
  @media (max-width: 640px) {
    .flt-tab { padding: 10px 14px; font-size: 0.88rem; }
  }
  /* 더보기(펼치기) 영역 */
  article details {
    border: 1px solid #d1d9e0;
    border-radius: 8px;
    background: #f6f8fa;
    padding: 10px 16px;
    margin: 10px 0;
  }
  article summary {
    cursor: pointer;
    font-weight: 600;
    outline: none;
  }
  article summary:hover { color: #0969da; }
  article details ul { margin-bottom: 0.4em; }
  /* 우선순위 뱃지 */
  article .prio {
    display: inline-block;
    font-size: 0.62em;
    font-weight: 700;
    line-height: 1.5;
    padding: 0.15em 0.7em;
    border-radius: 999px;
    color: #fff;
    vertical-align: 0.2em;
    margin-left: 0.5em;
    letter-spacing: 0;
  }
  article .p-high { background: #1a7f37; }
  article .p-mid { background: #9a6700; }
  article .p-low { background: #59636e; }
  article .p-no { background: #cf222e; }
  .loading, .error { color: #59636e; padding: 24px 0; }
  .error a { color: #0969da; }
</style>
</head>
<body>
  <header class="page-header">
    <div class="page-header-inner">
      <h1>Free LLM Tracker</h1>
      <p class="sub">Hermes Agent용 무료 LLM API 제공자 추적 기준선</p>
      <p class="meta">
        <span id="updated"></span>
        <a href="https://github.com/c00lpeace/free-llm-tracker">GitHub 저장소</a>
      </p>
    </div>
  </header>
  <div class="wrap">
    <article id="content">
      <p class="loading">기준선을 불러오는 중…</p>
    </article>
  </div>
  <script src="marked.min.js"></script>
  <script>
    var RAW_URL = "https://raw.githubusercontent.com/c00lpeace/free-llm-tracker/main/state.md";
    // 기간 한정 탭에 속하는 앵커 (목차 필터링·탭 자동전환용)
    var LTD_ANCHORS = { "limited-free": 1, "zerolimitai": 1, "hetzner-inference-api": 1 };
    var currentTab = "perm";

    function switchTab(name) {
      currentTab = name;
      var perm = document.getElementById("tab-perm");
      var ltd = document.getElementById("tab-ltd");
      if (perm) perm.style.display = (name === "perm") ? "" : "none";
      if (ltd) ltd.style.display = (name === "ltd") ? "" : "none";
      var btns = document.querySelectorAll(".flt-tab");
      for (var i = 0; i < btns.length; i++) {
        var on = btns[i].getAttribute("data-tab") === name;
        if (on) btns[i].classList.add("active");
        else btns[i].classList.remove("active");
        btns[i].setAttribute("aria-selected", on ? "true" : "false");
      }
      // 목차: 현재 탭의 항목만 표시 (변경 이력은 항상 표시)
      var items = document.querySelectorAll("#toc-list li");
      for (var j = 0; j < items.length; j++) {
        var a = items[j].querySelector('a[href^="#"]');
        var key = a ? a.getAttribute("href").slice(1) : "";
        var show;
        if (key === "changelog") show = true;
        else if (name === "perm") show = !LTD_ANCHORS[key];
        else show = !!LTD_ANCHORS[key];
        items[j].style.display = show ? "" : "none";
      }
      try { localStorage.setItem("flt-tab", name); } catch (e) {}
    }

    function buildTabs(el) {
      // "기간 한정 무료" h2부터 "변경 이력" h2 전까지를 별도 탭으로 분리
      var kids = Array.prototype.slice.call(el.childNodes);
      var head = document.createElement("div");
      var perm = document.createElement("div");
      var ltd = document.createElement("div");
      var cl = document.createElement("div");
      perm.id = "tab-perm";
      ltd.id = "tab-ltd";
      var mode = "head";
      var seenToc = false;
      var found = false;
      for (var i = 0; i < kids.length; i++) {
        var n = kids[i];
        if (n.nodeType === 1) {
          if (!seenToc && n.tagName === "DETAILS") {
            seenToc = true;
            head.appendChild(n);
            mode = "perm";
            continue;
          }
          var q1 = n.querySelector ? (n.querySelector("#limited-free") || (n.id === "limited-free" ? n : null)) : null;
          var q2 = n.querySelector ? (n.querySelector("#changelog") || (n.id === "changelog" ? n : null)) : null;
          var txt = (n.textContent || "").replace(/^\s+/, "");
          if (q1 || (n.tagName === "H2" && txt.indexOf("기간 한정 무료") === 0)) { mode = "ltd"; found = true; }
          else if (q2 || (n.tagName === "H2" && txt.indexOf("변경 이력") === 0)) { mode = "cl"; }
        }
        if (mode === "head") head.appendChild(n);
        else if (mode === "perm") perm.appendChild(n);
        else if (mode === "ltd") ltd.appendChild(n);
        else cl.appendChild(n);
      }
      if (!found) {
        // 기간 한정 섹션이 없으면 탭 없이 원래 순서대로 복원
        [head, perm, cl].forEach(function (d) {
          while (d.firstChild) el.appendChild(d.firstChild);
        });
        return false;
      }
      // 탭 바 삽입
      var bar = document.createElement("div");
      bar.className = "flt-tabs";
      bar.setAttribute("role", "tablist");
      bar.innerHTML =
        '<button class="flt-tab active" role="tab" aria-selected="true" data-tab="perm">상시 무료</button>' +
        '<button class="flt-tab" role="tab" aria-selected="false" data-tab="ltd">기간 한정 무료</button>';
      var btns = bar.querySelectorAll(".flt-tab");
      for (var b = 0; b < btns.length; b++) {
        btns[b].addEventListener("click", function () { switchTab(this.getAttribute("data-tab")); });
      }
      el.appendChild(head);
      el.appendChild(bar);
      el.appendChild(perm);
      el.appendChild(ltd);
      el.appendChild(cl);
      // 목차 ul에 id 부여
      var tocUl = head.querySelector("details ul");
      if (tocUl) tocUl.id = "toc-list";
      // 목차 링크 클릭: 다른 탭의 섹션이면 탭 전환 후 이동
      el.addEventListener("click", function (e) {
        var t = e.target;
        var a = (t && t.closest) ? t.closest('a[href^="#"]') : null;
        if (!a) return;
        var id = a.getAttribute("href").slice(1);
        if (id === "changelog") return; // 변경 이력은 항상 표시됨
        var need = LTD_ANCHORS[id] ? "ltd" : "perm";
        if (need !== currentTab) {
          e.preventDefault();
          switchTab(need);
          setTimeout(function () {
            var dest = document.getElementById(id);
            if (dest && dest.scrollIntoView) dest.scrollIntoView();
          }, 60);
        }
      });
      return true;
    }

    fetch(RAW_URL, { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (md) {
        var el = document.getElementById("content");
        el.innerHTML = marked.parse(md);
        var tabsOn = buildTabs(el);
        var start = "perm";
        try { start = localStorage.getItem("flt-tab") || "perm"; } catch (e) {}
        if (tabsOn) switchTab(start === "ltd" ? "ltd" : "perm");
        var links = el.querySelectorAll("a[href]");
        for (var i = 0; i < links.length; i++) {
          var href = links[i].getAttribute("href") || "";
          if (href.charAt(0) === "#") continue; // 페이지 내 목차 앵커는 현재 탭에서 이동
          links[i].target = "_blank";
          links[i].rel = "noopener";
        }
      })
      .catch(function () {
        document.getElementById("content").innerHTML =
          '<p class="error">기준선을 불러오지 못했습니다. ' +
          '<a href="https://github.com/c00lpeace/free-llm-tracker/blob/main/state.md" target="_blank" rel="noopener">' +
          'GitHub에서 직접 확인</a>해 주세요.</p>';
      });

    // 마지막 갱신일 표시 (실패해도 조용히 넘어감)
    fetch("https://api.github.com/repos/c00lpeace/free-llm-tracker/commits?path=state.md&per_page=1")
      .then(function (r) { return r.json(); })
      .then(function (c) {
        if (c && c[0] && c[0].commit) {
          var d = new Date(c[0].commit.committer.date);
          var s = d.getFullYear() + "-" +
            String(d.getMonth() + 1).padStart(2, "0") + "-" +
            String(d.getDate()).padStart(2, "0") + " " +
            String(d.getHours()).padStart(2, "0") + ":" +
            String(d.getMinutes()).padStart(2, "0");
          document.getElementById("updated").textContent = "마지막 갱신 " + s + " · 매일 06:00/18:00";
        }
      })
      .catch(function () {});
  </script>
</body>
</html>
